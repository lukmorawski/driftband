name: Release

# A version tag (vX.Y.Z) publishes the image to Docker Hub: tests, build for
# amd64 and arm64, smoke test of both, push with SBOM and provenance, then
# the Docker Hub overview. Needs the repository secrets DOCKERHUB_USERNAME
# and DOCKERHUB_TOKEN.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: lukmorawski/driftband

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: sectest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum
      - name: Tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://postgres:sectest@localhost:5432/postgres?sslmode=disable
        run: go vet ./... && go test -count=1 ./...

  image:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version and tags
        id: v
        run: |
          version=${GITHUB_REF_NAME#v}
          [ "$version" = "$(cat VERSION)" ] || { echo "tag $GITHUB_REF_NAME does not match VERSION ($(cat VERSION))" >&2; exit 1; }
          tags="$IMAGE:$version"
          case $version in
            *-*) ;;  # pre-release: the exact tag only
            *)
              tags="$tags,$IMAGE:${version%.*},$IMAGE:latest"
              [ "${version%%.*}" = 0 ] || tags="$tags,$IMAGE:${version%%.*}"
              ;;
          esac
          {
            echo "version=$version"
            echo "tags=$tags"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Each platform is built into the local image store and started before
      # anything is published (arm64 runs under emulation).
      - name: Build for the smoke test (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          tags: driftband:smoke-amd64
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
          cache-to: type=gha,mode=max
      - name: Smoke test (amd64)
        run: scripts/smoke-test.sh driftband:smoke-amd64 "${{ steps.v.outputs.version }}"

      - name: Build for the smoke test (arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: driftband:smoke-arm64
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (arm64)
        run: scripts/smoke-test.sh driftband:smoke-arm64 "${{ steps.v.outputs.version }}"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.v.outputs.tags }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.v.outputs.created }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha

      - name: Published image
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.v.outputs.version }}"

      - name: Docker Hub overview
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: scripts/dockerhub-description.sh
