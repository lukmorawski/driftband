# OWASP ZAP rule configuration for scripts/test-owasp.sh (zap-baseline /
# zap-full-scan "-c" file). One rule per line: "<id>\t<FAIL|WARN|IGNORE>\t(<name>)".
# Rules not listed here WARN. IGNORE only with the reason on the line above.
#
# Driftband serves a single-page application with a strict CSP
# (script-src 'self', no inline scripts, frame-ancestors 'none'), HttpOnly
# SameSite=Lax session cookies, no-store on the API and no third-party
# resources. Findings below are rated after review; see TESTING.md.

# --- treated as failures: these would be real regressions ---
10038	FAIL	(Content Security Policy (CSP) Header Not Set)
10020	FAIL	(Anti-clickjacking Header)
10021	FAIL	(X-Content-Type-Options Header Missing)
10010	FAIL	(Cookie No HttpOnly Flag)
10054	FAIL	(Cookie without SameSite Attribute)
40012	FAIL	(Cross Site Scripting (Reflected))
40014	FAIL	(Cross Site Scripting (Persistent))
40018	FAIL	(SQL Injection)
40019	FAIL	(SQL Injection - MySQL)
40022	FAIL	(SQL Injection - PostgreSQL)
6	FAIL	(Path Traversal)
7	FAIL	(Remote File Inclusion)
90019	FAIL	(Server Side Code Injection)
90020	FAIL	(Remote OS Command Injection)
40003	FAIL	(CRLF Injection)

# --- active rules switched off for the API scan (IGNORE turns a scanner off) ---
# DOM-based XSS drives a real browser: it does not apply to a JSON API and
# exceeds the memory of the test host.
40026	IGNORE	(Cross Site Scripting (DOM Based))
# Paths outside /api are answered with the application shell (text/html),
# which the API scan reports as an unexpected content type for every probe
# of a hidden file; the SPA fallback is intended.
100001	IGNORE	(Unexpected Content-Type was returned)

# --- reported by the API scan, by design ---
# The API returns times as Unix timestamps (created_at, expires_at).
10096	IGNORE	(Timestamp Disclosure - Unix)
# The audit log records the client address of every action; it is shown to
# the organization on purpose.
2	IGNORE	(Private IP Disclosure)

# --- informational notes, not findings ---
# ZAP notes that this is a script-rendered single-page application.
10109	IGNORE	(Modern Web Application)
# The cacheability rule reports a state, not a problem: stamped assets are
# cached for a year and the page for a minute on purpose (see TESTING.md).
10049	IGNORE	(Content Cacheability)
# localStorage holds the theme, the layout and which tree folders are
# collapsed; no session data or secrets.
120000	IGNORE	(Information Disclosure - Information in Browser localStorage)
