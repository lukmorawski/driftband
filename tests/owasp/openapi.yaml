# OpenAPI description of the Driftband JSON API, used by the OWASP ZAP API
# scan (scripts/test-owasp.sh) so every route is attacked, not only what a
# crawl of the single-page application finds. Keep it in step with
# apiRoutes() in backend/main.go: TestEveryRouteIsCovered lists the routes.
openapi: 3.0.3
info:
  title: Driftband API
  version: "0.1"
  description: JSON API of the Driftband latency monitor. Sessions are cookies (dband_session).
servers:
  - url: http://sut:8080

components:
  schemas:
    Id:
      type: integer
      format: int64
      example: 1
    Login:
      type: object
      properties:
        email: { type: string, format: email, example: user@example.com }
        password: { type: string, example: Register-pass-123 }
        code: { type: string, example: "123456" }
        webauthn_token: { type: string, example: "" }
        credential: { type: object, nullable: true, example: null }
        turnstile_token: { type: string, example: "" }
        captcha_pass: { type: string, example: "" }
    RegisterOrg:
      type: object
      properties:
        org_name: { type: string, example: Acme }
        email: { type: string, format: email, example: owner@example.com }
        password: { type: string, example: Register-pass-123 }
        turnstile_token: { type: string, example: "" }
    AcceptInvite:
      type: object
      properties:
        token: { type: string, example: abc }
        email: { type: string, format: email, example: joiner@example.com }
        password: { type: string, example: Joiner-pass-1234 }
        turnstile_token: { type: string, example: "" }
    Node:
      type: object
      properties:
        kind: { type: string, enum: [folder, host], example: host }
        name: { type: string, example: gateway }
        host: { type: string, example: 192.0.2.1 }
        description: { type: string, example: edge router }
        parent_id: { type: integer, format: int64, nullable: true, example: null }
        profile_id: { type: integer, format: int64, nullable: true, example: null }
    NodeUpdate:
      type: object
      properties:
        name: { type: string, example: gateway }
        host: { type: string, example: 192.0.2.1 }
        description: { type: string, example: edge router }
        profile_id: { type: integer, format: int64, nullable: true, example: null }
        parent_id: { type: integer, format: int64, nullable: true, example: null }
    Move:
      type: object
      properties:
        parent_id: { type: integer, format: int64, nullable: true, example: null }
        position: { type: integer, example: 0 }
    Profile:
      type: object
      properties:
        name: { type: string, example: Standard }
        interval_s: { type: integer, example: 60 }
        ping_count: { type: integer, example: 20 }
        packet_size: { type: integer, example: 56 }
        is_default: { type: boolean, example: false }
    Channel:
      type: object
      properties:
        name: { type: string, example: NOC }
        kind: { type: string, enum: [telegram, slack, teams, email, zabbix], example: slack }
        enabled: { type: boolean, example: true }
        config:
          type: object
          properties:
            chat_id: { type: string, example: "-100123456" }
            host: { type: string, example: smtp.example.com }
            port: { type: integer, example: 587 }
            security: { type: string, example: starttls }
            from: { type: string, example: alerts@example.com }
            to: { type: array, items: { type: string }, example: [noc@example.com] }
            auth: { type: string, example: password }
            username: { type: string, example: alerts@example.com }
            zabbix_url: { type: string, example: https://zabbix.example.com }
            zabbix_host: { type: string, example: Driftband }
        secrets:
          type: object
          properties:
            bot_token: { type: string, example: "123456789:AAEhBP0av28AbCdEfGhIjKlMnOpQrStUvWx" }
            webhook_url: { type: string, example: https://hooks.slack.com/services/T000/B000/x }
            password: { type: string, example: secret }
            client_secret: { type: string, example: secret }
            api_token: { type: string, example: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef }
    Rule:
      type: object
      properties:
        name: { type: string, example: Core loss }
        enabled: { type: boolean, example: true }
        node_id: { type: integer, format: int64, nullable: true, example: null }
        metric: { type: string, enum: [loss, latency], example: loss }
        threshold: { type: number, example: 20 }
        recover_threshold: { type: number, example: 5 }
        for_minutes: { type: integer, example: 5 }
        recover_minutes: { type: integer, example: 5 }
        notify_recovery: { type: boolean, example: true }
        repeat_minutes: { type: integer, example: 0 }
        flap_transitions: { type: integer, example: 4 }
        flap_window_minutes: { type: integer, example: 60 }
        channel_ids: { type: array, items: { type: integer, format: int64 }, example: [] }
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
  responses:
    ok:
      description: OK

paths:
  /api/auth/register-org:
    post:
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RegisterOrg" } } } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/auth/login:
    post:
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/Login" } } } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/auth/accept-invite:
    post:
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/AcceptInvite" } } } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/auth/invite-info:
    get:
      parameters:
        - { name: token, in: query, required: true, schema: { type: string, example: abc } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/auth/config:
    get:
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/health:
    get:
      responses: { "200": { $ref: "#/components/responses/ok" } }
  # GET /api/auth/sso/{provider}/start is deliberately absent: it redirects
  # to the provider, which is not ours to scan. The backend and browser
  # tests cover it.
  /api/auth/sso/finish:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                state: { type: string, example: login.abc }
                authorization_code: { type: string, example: abc }
                code: { type: string, example: "123456" }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  # POST /api/auth/logout is deliberately absent: importing the document
  # calls every operation once, and that call would end the scanner's own
  # session. The browser tests cover signing out.
  /api/me:
    get:
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/account/password:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                current: { type: string, example: Register-pass-123 }
                new: { type: string, example: Changed-pass-123 }
                confirm: { type: string, example: Changed-pass-123 }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/account/email:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email, example: new@example.com }
                password: { type: string, example: Register-pass-123 }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/account/name:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string, example: Ada }
                last_name: { type: string, example: Lovelace }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/account/2fa/setup:
    post:
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { password: { type: string, example: Register-pass-123 } } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/account/2fa/enable:
    post:
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { code: { type: string, example: "123456" } } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/account/2fa/disable:
    post:
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { password: { type: string, example: Register-pass-123 } } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/account/webauthn:
    get:
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/account/webauthn/register/begin:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, example: Register-pass-123 }
                kind: { type: string, enum: [key, passkey], example: key }
                name: { type: string, example: Desk key }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/account/webauthn/register/finish:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string, example: abc }
                credential: { type: object, example: { id: "AA", rawId: "AA", type: public-key, response: { clientDataJSON: "e30", attestationObject: "oA" } } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/account/webauthn/{id}/delete:
    post:
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { password: { type: string, example: Register-pass-123 } } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/account/sso:
    get:
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/account/sso/link:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string, enum: [google, entra], example: entra }
                password: { type: string, example: Register-pass-123 }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/account/sso/finish:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                state: { type: string, example: link.abc }
                authorization_code: { type: string, example: abc }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/account/sso/{provider}/unlink:
    post:
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [google, entra], example: entra } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { password: { type: string, example: Register-pass-123 } } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/account/avatar:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, example: image/png }
                data: { type: string, format: byte, example: "iVBORw0KGgo=" }
      responses: { "200": { $ref: "#/components/responses/ok" } }
    delete:
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/users:
    get:
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/users/{id}/avatar:
    get:
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: v, in: query, schema: { type: string } }
      responses: { "200": { description: the picture } }
  /api/users/{id}:
    delete:
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/users/{id}/role:
    patch:
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { role: { type: string, enum: [admin, member], example: member } } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/invites:
    get:
      responses: { "200": { $ref: "#/components/responses/ok" } }
    post:
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { role: { type: string, enum: [admin, member], example: member } } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/invites/{token}:
    delete:
      parameters:
        - { name: token, in: path, required: true, schema: { type: string, example: abc } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/profiles:
    get:
      responses: { "200": { $ref: "#/components/responses/ok" } }
    post:
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/profiles/{id}:
    patch:
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
    delete:
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/tree:
    get:
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/nodes:
    post:
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/Node" } } } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/nodes/{id}:
    patch:
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/NodeUpdate" } } } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
    delete:
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/nodes/{id}/move:
    post:
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/Move" } } } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/import/smokeping:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                config: { type: string, example: "*** Targets ***\n+ net\nmenu = net\n++ dns\nhost = 192.0.2.53\n" }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/series:
    get:
      parameters:
        - { name: host, in: query, required: true, schema: { type: integer, example: 1 } }
        - { name: from, in: query, schema: { type: integer, example: 0 } }
        - { name: to, in: query, schema: { type: integer, example: 9999999999 } }
        - { name: points, in: query, schema: { type: integer, example: 500 } }
        - { name: step, in: query, schema: { type: integer, example: 0 } }
        - { name: since, in: query, schema: { type: integer, example: 0 } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/status:
    get:
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/usage:
    get:
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/audit:
    get:
      parameters:
        - { name: limit, in: query, schema: { type: integer, example: 10 } }
        - { name: offset, in: query, schema: { type: integer, example: 0 } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/settings/retention:
    post:
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { years: { type: integer, example: 1 } } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/notify/channels:
    get:
      responses: { "200": { $ref: "#/components/responses/ok" } }
    post:
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/Channel" } } } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/notify/channels/{id}:
    patch:
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/Channel" } } } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
    delete:
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/notify/channels/{id}/test:
    post:
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/notify/rules:
    get:
      responses: { "200": { $ref: "#/components/responses/ok" } }
    post:
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/Rule" } } } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/notify/rules/{id}:
    patch:
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/Rule" } } } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
    delete:
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/notify/events:
    get:
      parameters:
        - { name: limit, in: query, schema: { type: integer, example: 10 } }
        - { name: offset, in: query, schema: { type: integer, example: 0 } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/admin/orgs:
    get:
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/admin/orgs/{id}/users:
    get:
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/admin/orgs/{id}/block:
    post:
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { blocked: { type: boolean, example: true } } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/admin/orgs/{id}/limits:
    patch:
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                host_limit: { type: integer, nullable: true, example: 10 }
                exempt_limits: { type: boolean, example: false }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/admin/orgs/{id}/hosts:
    get:
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/admin/orgs/{id}/delete:
    post:
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, example: Register-pass-123 }
                name: { type: string, example: Acme }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/admin/users/{id}/block:
    post:
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { blocked: { type: boolean, example: true } } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/admin/users/{id}/reset-password:
    post:
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reset_2fa: { type: boolean, example: false } } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/admin/users/{id}:
    delete:
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/admin/stats:
    get:
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/admin/settings:
    get:
      responses: { "200": { $ref: "#/components/responses/ok" } }
    patch:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                registration_open: { type: boolean, example: true }
      responses: { "200": { $ref: "#/components/responses/ok" } }
  /api/admin/audit:
    get:
      parameters:
        - { name: org, in: query, schema: { type: string, example: "" } }
        - { name: q, in: query, schema: { type: string, example: "" } }
        - { name: action, in: query, schema: { type: string, example: "" } }
        - { name: limit, in: query, schema: { type: integer, example: 10 } }
        - { name: offset, in: query, schema: { type: integer, example: 0 } }
      responses: { "200": { $ref: "#/components/responses/ok" } }
